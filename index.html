<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> xinfeihuang - homepage </title>
    <style>
        body { 
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;  /* 中文字体，确保显示正常 */
            max-width: 800px;  /* 页面最大宽度，避免在大屏上过宽 */
            margin: 50px auto;  /* 上下边距50px，左右自动居中 */
            padding: 20px;  /* 内边距，避免内容贴边 */
            line-height: 1.6;  /* 行高，提升可读性 */
            background-color: #f8f9fa;  /* 浅灰色背景，更柔和 */
        }
        h1 { 
            color: #2c3e50;  /* 深蓝色标题 */
            border-bottom: 2px solid #3498db;  /* 标题下边框，分隔线 */
            padding-bottom: 10px;
        }
        .info { 
            background-color: white;  /* 信息区域白色背景 */
            padding: 25px;  /* 内边距 */
            border-radius: 8px;  /* 圆角边框 */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);  /* 轻微阴影，立体感 */
            margin-top: 30px;
        }
        .email { 
            color: #e74c3c;  /* 红色邮箱，突出显示 */
            font-weight: bold; 
            font-size: 18px;  /* 稍大字体 */
        }
        .intro { 
            color: #555;  /* 灰色简介文字 */
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1> Xinfei Huang(黄鑫飞) </h1>  <!-- 替换为你的姓名，如“张三” -->

    <div class="info">
        <p><strong>邮箱：</strong><span class="email"> huangxinfei25@nudt.edu.cn </span></p>  <!-- 替换为邮箱，如“zhangsan@example.com” -->
        <p class="intro"><strong>简介：</strong> My research interests focus on optical image processing, interpretation and application </p>  <!-- 可选，建议填写 -->
        <p class="intro"><strong>所在地：</strong> China </p>  <!-- 可选补充信息 -->
    </div>
